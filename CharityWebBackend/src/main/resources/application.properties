spring.profiles.active=dev

spring.application.name=CharityWeb
server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/api/v1/payments/callback

ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.base-url=https://generativelanguage.googleapis.com
ai.gemini.model=gemini-2.5-flash
ai.gemini.fallback-model=gemini-flash-lite-latest
ai.gemini.fallback-models=gemini-flash-lite-latest,gemini-2.0-flash-lite,gemini-2.0-flash
ai.gemini.temperature=0.2
ai.gemini.max-output-tokens=1024
ai.gemini.retry-enabled=true
ai.gemini.retry-max-attempts=3
ai.gemini.retry-initial-backoff-ms=400

ai.chatbot.timeout-ms=15000
ai.chatbot.max-question-length=1000
ai.chatbot.max-context-projects=8
ai.chatbot.max-context-activities=5
ai.chatbot.max-project-description-chars=800
ai.chatbot.max-activity-content-chars=600
ai.chatbot.max-output-chars=2000
ai.chatbot.strict-upstream=false
ai.chatbot.anonymous-rate-limit=20
ai.chatbot.authenticated-rate-limit=60
ai.chatbot.rate-window-seconds=300
